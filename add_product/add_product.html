<h1 id="add-product-text">Add New Product</h1>
<section class="section1">
    
    
        
     <div class="name">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="name of the product" required>
     </div>

     <div>
        <label for="description" class="label-description" >Description:</label>
        <textarea id="description" name="description" placeholder="Product Description"></textarea>
     </div>

</section>

<section class="section2">


    <div>
        <label for="price" >Price:</label>
        <input type="number" id="price" name="price" placeholder="product price" required>
        <label for="in-stock" >in stock:</label>
        <input type="number" id="in-stock" name="in-stock" placeholder="number of product in stock" required>
    </div>
    
    <div class="discount">
        <label for="discount" >discount:</label>
        <input type="number" id="discount" name="discount" min="0" max="100" placeholder="if there is discount" >
        
    </div>


</section>



<section class="section3">


        <div class="image">
        <p>upload image</p>
        
       
        <input type="file" id="upload-image" name="upload-image" >
        <img src="" alt="" id="image">
        </div>



        <div>
            <p>add product</p>
            <input type="submit" value="add product" class="submit" >
        </div>
            


</section>

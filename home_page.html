<!DOCTYPE html>
<html>

<head>
    <title>Home page</title>
    <style>
        body {
            background-color: #382d3d;
            margin: 0;
            padding: 0;
        }

        #d1 {
            height: 40em;
            background-color: #382d3d;
            color: white;
            vertical-align: middle;
            align-content: left;
        }
        
        #d2 {
            padding: 2px;
            margin: 2em;
            display: inline-block;
            background-color: transparent;
            height: 1.5em;
            text-align: center;
            font-weight: bold;
            
        }


        .product-card {
            background-color: rgb(191, 167, 214);
            color: rgb(0, 0, 0);
            width: 250px;
            height: 600px;
            padding: 10px;
            border-radius: 10px;
        }

        .product-card img {
            width: 100%;
            height: auto;
        }
        .row {
        display:grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        align-items: center;
        padding: 1rem;
        }
        a {
            cursor: pointer;
        }

        .cart-button {
            padding: 8px 12px;
            border: none;
            border-radius: 25px;
            background-color: rgb(255, 210, 20);
            cursor:pointer;
            transition: opacity 0.15s;
        }
        .buy-button {
            padding: 8px 12px;
            border: none;
            border-radius: 25px;
            background-color: rgb(255, 164, 28);
            cursor:pointer;
            transition: opacity 0.15s;
        }
        .cart-button:hover{opacity: 0.8;}
        .buy-button:hover{opacity: 0.8;}
        .cart-button:active{opacity: 0.5;}
        .buy-button:active{opacity: 0.5;}
        #cart {
    background-color: transparent;
    border: none;
    cursor: pointer;
    width: 50px;
    height: 50px;
    position:fixed;
    top: 40px;
    left: 90%;
}

#cart_img {
    width: 50px;
    height: auto;
}
#sign_in{
  font-size: 125%;
  padding: 2px;
  margin: 2em;
  display: inline-block;
  width: 8em;
  height: auto;
  text-align: center;
  font-weight: bold;
  background-color: #382d3d;
  color: white;
  vertical-align: middle;
  position: fixed;
  top: 15px;
  left: 70%;
  text-decoration: none;
  
}
#Register{
  font-size: 125%;
  padding: 2px;
  margin: 2em;
  display: inline-block;
  width: 8em;
  height: auto;
  text-align: center;
  font-weight: bold;
  background-color: #382d3d;
  color: white;
  vertical-align: middle;
  position: fixed;
  top: 15px;
  left: 50%;
  text-decoration: none;
}
    </style>
    <meta name="the MODERNIST" content="width=device-width, initial-scale=1.0">
</head>

<body>
    
        <div name="container1" id="d1">
            <div id="d2">
                <a href="home_page.html" style="color:white; font-size: 200%; text-decoration: none;">
                    <span>The MODERNIST</span><br/>
                    <span>for design</span>
                </a>
                <a id="cart" href="cart_page.html"><img src="https://cdn-icons-png.flaticon.com/128/12588/12588590.png" id="cart_img" ></a>
                <a href="sign_in.html" id="sign_in">Sign In</a>
                <a href="sign_up.html" id="Register">Register</a>
            </div>

      
    <h2 style="text-align:center">Featured Products</h2>
        <div class="row" id="row-0"></div>

    <script> 
        const products = [
            {
                id : "1",
                name: "SAMSUNG Galaxy A16 5G",
                img: "https://m.media-amazon.com/images/I/61Lp1UcxeLL._AC_SX679_.jpg",
                description: "SAMSUNG Galaxy A16 5G A Series Cell Phone, Unlocked Android Smartphone, Large AMOLED Display...",
                oldPrice: "EGP8,070.00",
                newPrice: "EGP7,399.00",
                discount: "9% OFF"
            },
            {
                id : "2",
                name: "LED Light Bar",
                img: "https://m.media-amazon.com/images/I/61GwqKyW1PL._AC_SY879_.jpg",
                description: "LED Light Bar, Music Sync RGB Light Bar, USB Ambient Lamp, Color Changing...",
                oldPrice: "EGP1,000.00",
                newPrice: "EGP800.00",
                discount: "20% OFF"
            },
            {
                id : "3",
                name: "CTIME 3-Tier Medicine Organizer",
                img: "https://m.media-amazon.com/images/I/71d2okjshqL.__AC_SX300_SY300_QL70_FMwebp_.jpg",
                description: "Portable Medicine Cabinet with Leather Handle, Empty First Aid Kit for Home...",
                oldPrice: "EGP2,000.00",
                newPrice: "EGP1,850.00",
                discount: "7.5% OFF"
            }
        ];
        counter=0;
        rowscount =0;
        function addToCart(product) {
            counter++;
            alert(`${product.name} has been added to your cart!`);
            document.getElementById("cart").innerText = `Cart (${counter})`;
        };

        function createProductCard(product) {
            const card = document.createElement("div");
            card.className = "product-card";

            card.innerHTML = `
                <a href="product_page.html?id=${product.id}"class="product-link"><img id="product-img" src="${product.img}" alt="${product.name}" ></a>
                <h3 style="overflow: hidden; text-overflow: ellipsis;"id="product-name">${product.name}</h3>
                <p style="overflow: hidden; text-overflow: ellipsis;"id="product-desc">${product.description}</p>
                <p><s id="product-old-price">${product.oldPrice}</s id="product-new-price"> <strong>${product.newPrice}</strong> <span style="color:red">${product.discount}</span></p>
                <button class="cart-button" onclick="products.forEach(productt => if(product.name=productt.name){ {addToCart(${product}});}" style="bottom:20px;">Add to Cart</button>
                <button class="buy-button" onclick="products.forEach(productt => if(product.name=productt.name)" style="bottom:20px;">Buy now</button>
            `;
            if (counter === 4) {
                counter =0;
                const x = document.createElement("div");
                x.className = `row-${rowscount}`;
                x.classList = "row";
                rowscount++;
            }   

    return card;
}
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById(`row-${rowscount}`);
            products.forEach(product => {
                const card = createProductCard(product);
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>

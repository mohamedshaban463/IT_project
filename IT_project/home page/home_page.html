<!DOCTYPE html>
<html>

<head>
    <title>Home page</title>
    <style>
        body {
            background-color: #382d3d;
            margin: 0;
            padding: 0;
        }

        #d1 {
            height: 40em;
            background-color: #382d3d;
            color: white;
            vertical-align: middle;
            align-content: left;
        }

        #d2 {
            padding: 2px;
            margin: 6em;
            margin-top: 2em;
            display: inline-block;
            background-color: transparent;
            width: 14em;
            height: 1.5em;
            text-align: center;
            font-weight: bold;
        }


        .product-card {
            background-color: rgb(191, 167, 214);
            color: rgb(0, 0, 0);
            width: 250px;
            height: 600px;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;

        }

        .product-card img {
            width: 100%;
            height: auto;
        }
        .row {
        display:grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        align-items: center;
        padding: 1rem;
        }

        button {
            padding: 8px 12px;
            border: none;
            background-color: #ffffff;
            cursor:pointer;
        }
        #cart {
    background-color: transparent;
    border: none;
    cursor: pointer;
    width: 50px;
    height: 50px;
    position:fixed;
    top: 15px;
    left: 90%;
}

#cart_img {
    width: 50px;
    height: auto;
}
.nav {
    background-color: transparent;
    padding: 5px;
    margin: 1.3em;
    display: inline-block;
    background-color: #826b8d;
    width: auto;
    height: auto;
    border: none;
    border-radius: 5px;
    text-align: center;
    transition: all 1s 0.2s;
    color: white;
}
#nav {
    margin: 2em;
    width: 14em;
    height: 1.5em;
    text-align: center;
    font-weight: bold;
}
    </style>
    <meta name="the MODERNIST" content="width=device-width, initial-scale=1.0">
</head>

<body>
    
        <div name="container1" id="d1">
            <div id="d2">
                <font size="5">The MODERNIST</font><br />
                <font size="2">for design</font>
                <button id="cart" href="cart_page.html"><img src="https://cdn-icons-png.flaticon.com/128/12588/12588590.png" id="cart_img"></button>
            </div>
            <div id="nav">
            <button class="nav" href="home_page.html">Home</button>
            <button class="nav" href="">categories</button>
            </div>
      

    <h2 style="text-align:center">Featured Products</h2>
        <div class="row" id="row-0"></div>
    <script>
        const products = [
            {
                name: "SAMSUNG Galaxy A16 5G",
                img: "https://m.media-amazon.com/images/I/61Lp1UcxeLL._AC_SX679_.jpg",
                description: "SAMSUNG Galaxy A16 5G A Series Cell Phone, Unlocked Android Smartphone, Large AMOLED Display...",
                oldPrice: "EGP8,070.00",
                newPrice: "EGP7,399.00",
                discount: "9% OFF"
            },
            {
                name: "LED Light Bar",
                img: "https://m.media-amazon.com/images/I/61GwqKyW1PL._AC_SY879_.jpg",
                description: "LED Light Bar, Music Sync RGB Light Bar, USB Ambient Lamp, Color Changing...",
                oldPrice: "EGP1,000.00",
                newPrice: "EGP800.00",
                discount: "20% OFF"
            },
            {
                name: "CTIME 3-Tier Medicine Organizer",
                img: "https://m.media-amazon.com/images/I/71d2okjshqL.__AC_SX300_SY300_QL70_FMwebp_.jpg",
                description: "Portable Medicine Cabinet with Leather Handle, Empty First Aid Kit for Home...",
                oldPrice: "EGP2,000.00",
                newPrice: "EGP1,850.00",
                discount: "7.5% OFF"
            }
        ];
        counter=0;
        rowscount =0;
        function addToCart(product) {
            counter++;
            alert(`${product.name} has been added to your cart!`);
            document.getElementById("cart").innerText = `Cart (${counter})`;
        };

        function createProductCard(product) {
            const card = document.createElement("div");
            card.className = "product-card";

            card.innerHTML = `
                <img src="${product.img}" alt="${product.name}">
                <h3 style="overflow: hidden; text-overflow: ellipsis;">${product.name}</h3>
                <p style="overflow: hidden; text-overflow: ellipsis;">${product.description}</p>
                <p><s>${product.oldPrice}</s> <strong>${product.newPrice}</strong> <span style="color:red">${product.discount}</span></p>
                <button onclick="addToCart(${product})" style="bottom:20px;">Add to Cart</button>
            `;
            if (counter === 4) {
                counter =0;
                const x = document.createElement("div");
                x.className = `row-${rowscount}`;
                x.classList = "row";
                rowscount++;
            }

            return card;
            }

        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById(`row-${rowscount}`);
            products.forEach(product => {
                const card = createProductCard(product);
                container.appendChild(card);
            });
        });
    </script>
</body>

</html>

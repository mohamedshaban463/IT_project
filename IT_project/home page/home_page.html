<!DOCTYPE html>
<html>

<head>
    <title>Home page</title>
    <style>
        body {
            background-color: #382d3d;
            margin: 0;
            padding: 0;
        }

        .arrow {
            fill: white !important;
        }

        #d1 {
            height: 40em;
            background-color: #382d3d;
            color: white;
            vertical-align: middle;
            align-content: center;
        }

        #d2 {
            padding: 2px;
            margin: 6em;
            margin-top: 2em;
            display: inline-block;
            background-color: transparent;
            width: 14em;
            height: 1.5em;
            text-align: center;
            font-weight: bold;
        }

        .c1 {
            padding: 5px;
            margin: 1.3em;
            margin-top: 2em;
            display: inline-block;
            background-color: transparent;
            width: 5em;
            height: 1.5em;
            border: 3px solid transparent;
            border-radius: 15px;
            text-align: center;
            transition: all 1s 0.2s;
        }

        #d3 {
            background-color: #6dc9ff;
            color: black;
        }

        .c1:hover {
            background-color: #6dc9ff;
            color: black;;
        }

        .arrow:hover {
            fill: #f36dff;
        }

        .product-card {
            display: inline-block;
            background-color: rgb(231, 207, 238);
            color: black;
            width: 250px;
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;

        }

        .product-card img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }

        button {
            padding: 8px 12px;
            border: none;
            background-color: #0c84a1;
            cursor:pointer;
        }
    </style>
</head>

<body>
    
        <div name="container1" id="d1">
            <div id="d2">
                <font size="5">The MODERNIST</font><br />
                <font size="2">for design</font>
            </div>
            <button id="home button" href="home_page.html">Home</button>

      

    <h2 style="text-align:center">Featured Products</h2>
        <div id="product-container"></div>
    <script>
        const products = [
            {
                name: "SAMSUNG Galaxy A16 5G",
                img: "https://m.media-amazon.com/images/I/61Lp1UcxeLL._AC_SX679_.jpg",
                description: "SAMSUNG Galaxy A16 5G A Series Cell Phone, Unlocked Android Smartphone, Large AMOLED Display...",
                oldPrice: "EGP8,070.00",
                newPrice: "EGP7,399.00",
                discount: "9% OFF"
            },
            {
                name: "LED Light Bar",
                img: "https://m.media-amazon.com/images/I/61GwqKyW1PL._AC_SY879_.jpg",
                description: "LED Light Bar, Music Sync RGB Light Bar, USB Ambient Lamp, Color Changing...",
                oldPrice: "EGP1,000.00",
                newPrice: "EGP800.00",
                discount: "20% OFF"
            },
            {
                name: "CTIME 3-Tier Medicine Organizer",
                img: "https://m.media-amazon.com/images/I/71d2okjshqL.__AC_SX300_SY300_QL70_FMwebp_.jpg",
                description: "Portable Medicine Cabinet with Leather Handle, Empty First Aid Kit for Home...",
                oldPrice: "EGP2,000.00",
                newPrice: "EGP1,850.00",
                discount: "7.5% OFF"
            }
        ];

        function createProductCard(product) {
            const card = document.createElement("div");
            card.className = "product-card";

            card.innerHTML = `
                <img src="${product.img}" alt="${product.name}">
                <h3>${product.name}</h3>
                <p>${product.description}</p>
                <p><s>${product.oldPrice}</s> <strong>${product.newPrice}</strong> <span style="color:red">${product.discount}</span></p>
                <button>Add to Cart</button>
            `;

            return card;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("product-container");
            products.forEach(product => {
                const card = createProductCard(product);
                container.appendChild(card);
            });
        });
    </script>
</body>

</html>
